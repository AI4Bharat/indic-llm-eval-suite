# MATH-500 -- the 500-problem MATH subset, with full worked solutions.
#
# 'problem' and 'solution' are translated together so the solution keeps
# referring to the same quantities and phrasing as the problem. 'answer' (the
# boxed final answer) is NOT translated: it is pure LaTeX and stays byte-identical,
# which is what any grader compares against. 'subject', 'level' and 'unique_id'
# are carried through untouched.
#
#   test 500 rows x 14 languages = 7,000 requests
#
# Note: solutions contain LaTeX and [asy]...[/asy] Asymptote blocks, which are
# long and must survive byte-for-byte -- hence the large max_output_tokens.

benchmark: math_500

source:
  type: huggingface
  path: HuggingFaceH4/MATH-500
  splits: [test]          # this dataset has no configs, only a test split
  id_field: unique_id     # e.g. "test/precalculus/807.json"; left untouched
  cache_dir: null

fields:
  default:
    - [problem, solution]

languages:
  Assamese: as
  Bengali: bn
  Gujarati: gu
  Hindi: hi
  Kannada: kn
  Malayalam: ml
  Marathi: mr
  Nepali: ne
  Odia: or
  Punjabi: pa
  Sanskrit: sa
  Tamil: ta
  Telugu: te
  Urdu: ur

# Defaults inherited by every stage; each stage can override any of them.
stage_defaults: &stage_defaults
  inference:
    mode: batch
    # Low, deliberately: every LaTeX delimiter, command and digit has to come
    # back unchanged. Sampling diversity buys nothing and costs fidelity.
    temperature: 0.2
    max_output_tokens: 32768
    json_mode: true
    max_requests_per_batch: 50000
    poll_interval_seconds: 30
  max_attempts: 3
  # Anything still failing after the batch attempts is finished in parallel
  # mode. Set enabled: false to leave it in failures.jsonl instead.
  fallback: &fallback
    enabled: true
    max_attempts: 2
    num_workers: 32

stages:
  translate:
    <<: *stage_defaults
    prompt: ../prompts/translate/math_500.md
    model: gemini-3.7-flash

  judge:
    <<: *stage_defaults
    prompt: ../prompts/judge/math_500.md
    model: gemini-3.7-flash
    # The agreed bar is 98. This judge's own rubric calls >=70 as "no major or critical errors" a pass, and
    # correct_r1 ran at 70; the recorrect pass (correct_r2) then swept
    # everything still below 98. Pinned to 98 so any future round uses the
    # current bar rather than the one this benchmark happened to start on.
    pass_threshold: 98
    score_scale: 100
    max_attempts: 2

  correct:
    <<: *stage_defaults
    prompt: ../prompts/correct/math_500.md
    model: gemini-3.7-flash
    max_attempts: 2
    # NOTE: stage_correct selects on 'score <= max_score', so 97 is how you
    # spell "correct everything below 98" -- which is the agreed bar. Judge
    # scores are always integers in practice, and 99 is never emitted, so <=97
    # and <98 pick exactly the same records. Setting this to 98 would
    # additionally sweep in the very large 98-scoring bucket.
    # (correct_r1 on this benchmark ran at 70; correct_r2 raised it to 98.)
    max_score: 97

output:
  root: ../data
  destination: local              # or: huggingface
  hub_repo: null                  # e.g. your-org/math-500-indic
  private: true
  column_template: "{field}_{language}"
  keep_source_columns: true
  include_quality_columns: false
  format: jsonl

# stage 5: the flat, one-row-per-instance file handed to human reviewers
review:
  fail_threshold: 98
  sample_rate: 0.25
  sample_seed: "math-500-human-review-v1"
  csv: true
  include_judge_details: true
  include_all_rows: true

# Prices for anything the built-in table does not know about (USD per 1M tokens).
# Interactive rates -- batch jobs are billed at 50% of these, and the report
# applies that discount itself from the mode each request ran in.
pricing:
  gemini-3.7-flash:
    input_per_1m: 0.75
    output_per_1m: 3.75           # reasoning/thinking tokens are billed as output
